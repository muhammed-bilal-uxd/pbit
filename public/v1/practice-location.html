<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="pbjt-practice-loc-v1">
      <div class="pbjt-practice-loc-v1__wrap">
        <div class="pbjt-practice-loc-v1__hero">
          <div class="pbjt-practice-loc-v1__hero-copy">
            <h1 class="pbjt-practice-loc-v1__title">
              <span class="pbjt-practice-loc-v1__title-accent">PBJT</span>
              <span class="pbjt-practice-loc-v1__title-main">In Practice</span>
            </h1>

            <h2 class="pbjt-practice-loc-v1__subtitle">In Tamil Nadu</h2>

            <p class="pbjt-practice-loc-v1__desc">
              Explore how transition is experienced across
              <br />
              places, systems and communities
            </p>
          </div>

          <div class="pbjt-practice-loc-v1__hero-map">
            <img
              src="YOUR-TAMIL-NADU-MAP-IMAGE.png"
              alt="Tamil Nadu district map"
              class="pbjt-practice-loc-v1__map-img"
            />
          </div>
        </div>

        <div class="pbjt-practice-loc-v1__chooser">
          <div class="pbjt-practice-loc-v1__chooser-head">
            <div class="pbjt-practice-loc-v1__pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 22c-.42 0-.8-.18-1.06-.49C9.15 19.36 4 13.41 4 9a8 8 0 1 1 16 0c0 4.41-5.15 10.36-6.94 12.51-.26.31-.64.49-1.06.49Z"
                  fill="currentColor"
                />
                <circle cx="12" cy="9" r="3.25" fill="#ffffff" />
                <path
                  d="M6.1 21.4c0-1.12 2.64-2.03 5.9-2.03s5.9.91 5.9 2.03"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </div>

            <div class="pbjt-practice-loc-v1__chooser-text">
              <h3 class="pbjt-practice-loc-v1__chooser-title">
                Choose A Location
              </h3>
              <p class="pbjt-practice-loc-v1__chooser-subtext">
                (Select a district to explore local stories and changes)
              </p>
            </div>
          </div>

          <div class="pbjt-practice-loc-v1__grid">
            <a href="#" class="pbjt-practice-loc-v1__card">
              <div class="pbjt-practice-loc-v1__card-left">
                <img
                  src="YOUR-DINDIGUL-MAP.png"
                  alt="Dindigul"
                  class="pbjt-practice-loc-v1__district-img"
                />
                <span class="pbjt-practice-loc-v1__district-name"
                  >Dindigul</span
                >
              </div>
              <span class="pbjt-practice-loc-v1__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8 4l8 8-8 8"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </a>

            <a href="#" class="pbjt-practice-loc-v1__card">
              <div class="pbjt-practice-loc-v1__card-left">
                <img
                  src="YOUR-VIRUDHUNAGAR-MAP.png"
                  alt="Virudhnagar"
                  class="pbjt-practice-loc-v1__district-img"
                />
                <span class="pbjt-practice-loc-v1__district-name"
                  >Virudhnagar</span
                >
              </div>
              <span class="pbjt-practice-loc-v1__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8 4l8 8-8 8"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </a>

            <a href="#" class="pbjt-practice-loc-v1__card">
              <div class="pbjt-practice-loc-v1__card-left">
                <img
                  src="YOUR-KRISHNAGIRI-MAP.png"
                  alt="Krishnagiri"
                  class="pbjt-practice-loc-v1__district-img"
                />
                <span class="pbjt-practice-loc-v1__district-name"
                  >Krishnagiri</span
                >
              </div>
              <span class="pbjt-practice-loc-v1__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8 4l8 8-8 8"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </a>

            <a href="#" class="pbjt-practice-loc-v1__card">
              <div class="pbjt-practice-loc-v1__card-left">
                <img
                  src="YOUR-HOSUR-MAP.png"
                  alt="Hosur"
                  class="pbjt-practice-loc-v1__district-img"
                />
                <span class="pbjt-practice-loc-v1__district-name">Hosur</span>
              </div>
              <span class="pbjt-practice-loc-v1__arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8 4l8 8-8 8"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <style>
      .pbjt-practice-loc-v1,
      .pbjt-practice-loc-v1 * {
        box-sizing: border-box;
      }

      .pbjt-practice-loc-v1 {
        --pbjt-bg: #f2f2f2;
        --pbjt-text: #111111;
        --pbjt-muted: #5a5a5a;
        --pbjt-red: #ec1027;
        --pbjt-border: #ef2a3a;
        --pbjt-white: #ffffff;

        width: 100%;
        background: var(--pbjt-bg);
        padding: 48px 20px 64px;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--pbjt-text);
        position: relative;
        isolation: isolate;
      }

      .pbjt-practice-loc-v1 a,
      .pbjt-practice-loc-v1 a:hover,
      .pbjt-practice-loc-v1 a:focus,
      .pbjt-practice-loc-v1 a:visited {
        text-decoration: none;
      }

      .pbjt-practice-loc-v1__wrap {
        max-width: 1180px;
        margin: 0 auto;
      }

      .pbjt-practice-loc-v1__hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        align-items: start;
        column-gap: 60px;
        row-gap: 28px;
        margin-bottom: 34px;
      }

      .pbjt-practice-loc-v1__hero-copy {
        padding-top: 6px;
      }

      .pbjt-practice-loc-v1__title {
        margin: 0 0 10px;
        font-size: clamp(42px, 5vw, 62px);
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .pbjt-practice-loc-v1__title-accent {
        color: var(--pbjt-primary-color);
        display: inline-block;
        margin-right: 10px;
      }

      .pbjt-practice-loc-v1__title-main {
        color: var(--pbjt-text);
        display: inline-block;
      }

      .pbjt-practice-loc-v1__subtitle {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.08;
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .pbjt-practice-loc-v1__desc {
        margin: 28px 0 0;
        max-width: 620px;
        font-size: clamp(18px, 1.8vw, 27px);
        line-height: 1.72;
        font-weight: 400;
        color: var(--pbjt-text);
      }

      .pbjt-practice-loc-v1__hero-map {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .pbjt-practice-loc-v1__map-img {
        width: 100%;
        max-width: 400px;
        height: auto;
        display: block;
        object-fit: contain;
      }

      .pbjt-practice-loc-v1__chooser {
        margin-top: 6px;
      }

      .pbjt-practice-loc-v1__chooser-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }

      .pbjt-practice-loc-v1__pin {
        width: 62px;
        height: 62px;
        color: var(--pbjt-primary-color);
        flex: 0 0 62px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pbjt-practice-loc-v1__pin svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .pbjt-practice-loc-v1__chooser-text {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pbjt-practice-loc-v1__chooser-title {
        margin: 0;
        font-size: clamp(24px, 2.3vw, 38px);
        line-height: 1.1;
        font-weight: 700;
        color: var(--pbjt-primary-color);
        letter-spacing: -0.02em;
      }

      .pbjt-practice-loc-v1__chooser-subtext {
        margin: 0;
        font-size: clamp(14px, 1.15vw, 22px);
        line-height: 1.35;
        color: var(--pbjt-muted);
        font-weight: 600;
      }

      .pbjt-practice-loc-v1__grid {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 36px 36px;
      }

      .pbjt-practice-loc-v1__card {
        min-height: 110px;
        background: var(--pbjt-white);
        border: 2px solid var(--pbjt-border);
        border-radius: 10px;
        padding: 16px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }

      .pbjt-practice-loc-v1__card:hover,
      .pbjt-practice-loc-v1__card:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        border-color: var(--pbjt-primary-color);
        outline: none;
      }

      .pbjt-practice-loc-v1__card-left {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        flex: 1 1 auto;
      }

      .pbjt-practice-loc-v1__district-img {
        width: 98px;
        max-width: 98px;
        height: 56px;
        object-fit: contain;
        display: block;
        flex: 0 0 98px;
      }

      .pbjt-practice-loc-v1__district-name {
        display: block;
        font-size: clamp(20px, 1.75vw, 34px);
        line-height: 1.15;
        font-weight: 700;
        color: var(--pbjt-text);
        letter-spacing: -0.02em;
      }

      .pbjt-practice-loc-v1__arrow {
        width: 58px;
        height: 58px;
        flex: 0 0 58px;
        border: 2px solid var(--pbjt-border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pbjt-primary-color);
        background: var(--pbjt-white);
      }

      .pbjt-practice-loc-v1__arrow svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      @media (max-width: 1024px) {
        .pbjt-practice-loc-v1 {
          padding: 42px 18px 56px;
        }

        .pbjt-practice-loc-v1__hero {
          grid-template-columns: 1fr;
        }

        .pbjt-practice-loc-v1__hero-copy {
          text-align: left;
        }

        .pbjt-practice-loc-v1__hero-map {
          justify-content: flex-start;
        }

        .pbjt-practice-loc-v1__map-img {
          max-width: 320px;
        }

        .pbjt-practice-loc-v1__grid {
          grid-template-columns: 1fr;
          gap: 24px;
          max-width: 100%;
        }
      }

      @media (max-width: 767px) {
        .pbjt-practice-loc-v1 {
          padding: 34px 16px 44px;
        }

        .pbjt-practice-loc-v1__title {
          margin-bottom: 8px;
        }

        .pbjt-practice-loc-v1__desc {
          margin-top: 18px;
          line-height: 1.55;
        }

        .pbjt-practice-loc-v1__chooser-head {
          align-items: flex-start;
          gap: 10px;
          margin-bottom: 20px;
        }

        .pbjt-practice-loc-v1__pin {
          width: 48px;
          height: 48px;
          flex-basis: 48px;
        }

        .pbjt-practice-loc-v1__chooser-text {
          display: block;
        }

        .pbjt-practice-loc-v1__chooser-subtext {
          margin-top: 4px;
          display: block;
        }

        .pbjt-practice-loc-v1__card {
          min-height: 92px;
          padding: 12px;
          gap: 12px;
        }

        .pbjt-practice-loc-v1__card-left {
          gap: 12px;
        }

        .pbjt-practice-loc-v1__district-img {
          width: 72px;
          max-width: 72px;
          height: 44px;
          flex-basis: 72px;
        }

        .pbjt-practice-loc-v1__arrow {
          width: 48px;
          height: 48px;
          flex-basis: 48px;
        }
      }

      @media (max-width: 479px) {
        .pbjt-practice-loc-v1__district-name {
          font-size: 22px;
        }

        .pbjt-practice-loc-v1__card {
          border-radius: 8px;
        }

        .pbjt-practice-loc-v1__arrow svg {
          width: 20px;
          height: 20px;
        }
      }
    </style>
  </body>
</html>
