<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="pbjt-climate-table-v1">
      <div class="pbjt-climate-table-v1__wrap">
        <div class="pbjt-climate-table-v1__card">
          <div class="pbjt-climate-table-v1__head">
            <h2 class="pbjt-climate-table-v1__title">
              HEAT AND RAIN FALL TABLE
            </h2>
            <p class="pbjt-climate-table-v1__subtitle">
              Year-wise rainfall and temperature overview
            </p>
          </div>

          <div class="pbjt-climate-table-v1__table-wrap">
            <table class="pbjt-climate-table-v1__table">
              <thead>
                <tr>
                  <th>Year</th>
                  <th>Annual Rainfall (mm)</th>
                  <th>Min Temperature (°C)</th>
                  <th>Max Temperature (°C)</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>2021</td>
                  <td>240.5 mm</td>
                  <td>19.5</td>
                  <td>37.5</td>
                </tr>
                <tr>
                  <td>2022</td>
                  <td>1303.6 mm</td>
                  <td>19.8</td>
                  <td>38.2</td>
                </tr>
                <tr>
                  <td>2023</td>
                  <td></td>
                  <td>19</td>
                  <td>38.7</td>
                </tr>
                <tr>
                  <td>2024</td>
                  <td></td>
                  <td>20</td>
                  <td>38</td>
                </tr>
                <tr>
                  <td>2025</td>
                  <td></td>
                  <td>19.1</td>
                  <td>39</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <style>
      .pbjt-climate-table-v1,
      .pbjt-climate-table-v1 * {
        box-sizing: border-box;
      }

      .pbjt-climate-table-v1 {
        --pbjt-ct-bg: #f4f1ea;
        --pbjt-ct-card: #fbf8f1;
        --pbjt-ct-text: #1e2a36;
        --pbjt-ct-muted: #66707a;
        --pbjt-ct-line: #cbbd93;
        --pbjt-ct-line-soft: #e7ddc4;
        --pbjt-ct-accent: #8a6a1f;
        --pbjt-ct-white: #ffffff;

        width: 100%;
        padding: 24px 16px;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--pbjt-ct-text);
        isolation: isolate;
      }

      .pbjt-climate-table-v1__wrap {
        max-width: 1100px;
        margin: 0 auto;
      }

      .pbjt-climate-table-v1__card {
        background: linear-gradient(180deg, #fcfaf4 0%, #f7f2e8 100%);
        border: 1px solid #e8dec8;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(45, 42, 34, 0.08);
        overflow: hidden;
      }

      .pbjt-climate-table-v1__head {
        padding: 20px 22px 12px;
        border-bottom: 1px solid rgba(203, 189, 147, 0.35);
      }

      .pbjt-climate-table-v1__title {
        margin: 0;
        font-size: clamp(20px, 2.2vw, 28px);
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--pbjt-ct-text);
      }

      .pbjt-climate-table-v1__subtitle {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--pbjt-ct-muted);
      }

      .pbjt-climate-table-v1__table-wrap {
        width: 100%;
        overflow-x: auto;
        padding: 6px 10px 14px;
      }

      .pbjt-climate-table-v1__table {
        width: 100%;
        min-width: 720px;
        border-collapse: separate;
        border-spacing: 0;
        background: transparent;
      }

      .pbjt-climate-table-v1__table thead th {
        text-align: left;
        padding: 14px 12px 12px;
        font-size: 15px;
        line-height: 1.3;
        font-weight: 700;
        color: var(--pbjt-ct-text);
        background: rgba(203, 189, 147, 0.12);
        border-bottom: 3px solid var(--pbjt-ct-line);
        white-space: nowrap;
      }

      .pbjt-climate-table-v1__table thead th:first-child {
        border-top-left-radius: 10px;
      }

      .pbjt-climate-table-v1__table thead th:last-child {
        border-top-right-radius: 10px;
      }

      .pbjt-climate-table-v1__table tbody td {
        padding: 14px 12px;
        font-size: 16px;
        line-height: 1.35;
        color: var(--pbjt-ct-text);
        border-bottom: 1px solid var(--pbjt-ct-line-soft);
        vertical-align: middle;
      }

      .pbjt-climate-table-v1__table tbody tr:last-child td {
        border-bottom: none;
      }

      .pbjt-climate-table-v1__table tbody tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.35);
      }

      .pbjt-climate-table-v1__table tbody tr:hover td {
        background: rgba(203, 189, 147, 0.12);
      }

      .pbjt-climate-table-v1__table tbody td:first-child {
        font-weight: 700;
        color: var(--pbjt-ct-accent);
        white-space: nowrap;
      }

      .pbjt-climate-table-v1__table tbody td:empty::after {
        content: "—";
        color: #a6a09a;
      }

      @media (max-width: 767px) {
        .pbjt-climate-table-v1 {
          padding: 18px 10px;
        }

        .pbjt-climate-table-v1__card {
          border-radius: 12px;
        }

        .pbjt-climate-table-v1__head {
          padding: 16px 16px 10px;
        }

        .pbjt-climate-table-v1__table-wrap {
          padding: 6px 8px 12px;
        }

        .pbjt-climate-table-v1__table thead th,
        .pbjt-climate-table-v1__table tbody td {
          padding: 12px 10px;
          font-size: 14px;
        }
      }
    </style>
  </body>
</html>
